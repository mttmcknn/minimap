name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  layout-helper:
    name: Reproducible layout helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify bundled helper matches source
        run: python3 crates/minimap-android/helper/build.py --check
  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Evaluation contracts
        run: python3 -m unittest discover -s evals -p 'test_*.py'
      - name: Build
        run: cargo build -p minimap-cli --bin minimap
      - name: Verify crate archives
        run: cargo package --workspace
