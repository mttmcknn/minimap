    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52616e" x="790.868571" y="348.192" transform="rotate(-0 790.868571 348.192)">20/20 verified</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182a3a" x="623.314286" y="106.32" transform="rotate(-0 623.314286 106.32)">Jetchat</text>
   </g>
  </g>
  <g id="text_28">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182a3a" x="47.52" y="36.156563" transform="rotate(-0 47.52 36.156563)">Less text for the AI to read</text>
  </g>
  <g id="text_29">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616e" x="47.52" y="63.118125" transform="rotate(-0 47.52 63.118125)">A token is a small chunk of text. Shorter bars mean less tool output.</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52616e" transform="translate(47.52 377.680313)">Bars = medians of successful trips, combining both Android versions (o200k_base).</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52616e" transform="translate(47.52 392.819375)">Only navigation stdout and stderr are counted, once each. Instructions and AI reasoning are excluded.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #52616e" transform="translate(47.52 407.819375)">This is not a measurement of total model tokens or money saved.</text>
  </g>
